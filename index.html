<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Grade Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Student Grade Calculator</h1>
        <p>Enter marks for five subjects.</p>

        <label for="math">Mathematics</label>
        <input type="number" id="math" placeholder="Enter marks">

        <label for="computer">Computer Science</label>
        <input type="number" id="computer" placeholder="Enter marks">

        <label for="english">English</label>
        <input type="number" id="english" placeholder="Enter marks">

        <label for="physics">Physics</label>
        <input type="number" id="physics" placeholder="Enter marks">

        <label for="chemistry">Chemistry</label>
        <input type="number" id="chemistry" placeholder="Enter marks">

        <button id="calculateBtn">Calculate Result</button>

        <div id="result"></div>

    </div>

    <script src="script.js"></script>
</body>
</html>
